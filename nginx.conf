server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index home.html index.html;

    # Compression gzip pour accélérer le chargement
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache long pour les assets statiques (images, css, js versionnés)
    location ~* \.(?:jpg|jpeg|png|gif|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Les pages HTML ne sont pas mises en cache longtemps (pour voir les
    # mises à jour de contenu rapidement)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Page 404 personnalisée si tu en crées une (sinon Nginx renvoie sa propre 404)
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}